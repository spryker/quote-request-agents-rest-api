resource:
    name: AgentQuoteRequests
    shortName: agent-quote-requests
    description: 'Quote request management for sales agents'

    provider: Spryker\Glue\QuoteRequestAgentsRestApi\Api\Storefront\Provider\AgentQuoteRequestsStorefrontProvider
    processor: Spryker\Glue\QuoteRequestAgentsRestApi\Api\Storefront\Processor\AgentQuoteRequestsStorefrontProcessor

    paginationEnabled: true

    security: "is_granted('ROLE_AGENT')"

    operations:
        - type: GetCollection
          description: 'Retrieve all quote requests'
          openapiContext:
              responses:
                  200:
                      description: 'Collection of quote requests visible to the agent.'
                  401:
                      description: 'Invalid agent access token.'
                  403:
                      description: 'No agent access token supplied.'

        - type: Get
          description: 'Retrieve a specific quote request by reference'
          openapiContext:
              responses:
                  200:
                      description: 'Quote request returned.'
                  401:
                      description: 'Invalid agent access token.'
                  403:
                      description: 'No agent access token supplied.'
                  404:
                      description: 'Quote request not found (code 4501).'

        - type: Post
          description: 'Create a new quote request on behalf of a company user'
          openapiContext:
              responses:
                  201:
                      description: 'Quote request created.'
                  401:
                      description: 'Invalid agent access token.'
                  403:
                      description: 'No agent access token supplied.'
                  404:
                      description: 'Company user not found (code 1404).'
                  422:
                      description: 'Validation failure — invalid delivery date (code 4506) or empty cart (code 4503).'

        - type: Patch
          description: 'Update an existing quote request'
          openapiContext:
              responses:
                  200:
                      description: 'Quote request updated.'
                  401:
                      description: 'Invalid agent access token.'
                  403:
                      description: 'No agent access token supplied.'
                  404:
                      description: 'Quote request not found (code 4501).'
                  422:
                      description: 'Wrong status (code 4504), concurrent edit (code 4505) or validation failure (code 4506).'

    properties:
        quoteRequestReference:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Unique quote request reference'
            openapiContext:
                example: 'DE--21-123'

        status:
            type: string
            writable: false
            readable: true
            description: 'Current status of the quote request'
            openapiContext:
                example: 'in-progress'

        isLatestVersionVisible:
            type: boolean
            writable: true
            readable: true
            required: false
            description: 'Whether the latest version is visible to the customer'
            openapiContext:
                example: true

        createdAt:
            type: string
            writable: false
            readable: true
            description: 'Creation timestamp'
            openapiContext:
                example: '2025-01-01T10:00:00+00:00'

        validUntil:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Expiration timestamp'
            openapiContext:
                example: '2025-02-01T23:59:59+00:00'

        versions:
            type: array
            writable: false
            readable: true
            description: 'List of version references'
            openapiContext:
                example: ['DE--21-123-1', 'DE--21-123-2']

        shownVersion:
            type: object
            objectName: QuoteRequestVersion
            writable: false
            readable: true
            description: 'Currently shown version with cart, metadata, and totals'
            properties:
                version:
                    type: integer
                    description: 'Version number.'
                    openapiContext:
                        example: 1
                versionReference:
                    type: string
                    description: 'Version reference.'
                    openapiContext:
                        example: 'DE--21-123-1'
                cart:
                    type: object
                    objectName: QuoteRequestVersionCart
                    description: 'Cart snapshot for this version.'
                    properties:
                        priceMode:
                            type: string
                            description: 'Price mode.'
                            openapiContext:
                                example: 'GROSS_MODE'
                        currency:
                            type: string
                            description: 'Currency code.'
                            openapiContext:
                                example: 'EUR'
                        store:
                            type: string
                            description: 'Store name.'
                            openapiContext:
                                example: 'DE'
                        billingAddress:
                            type: object
                            description: 'Billing address.'
                            openapiContext:
                                example: null
                        discounts:
                            type: array
                            description: 'Applied discounts.'
                            openapiContext:
                                example: []
                        shipments:
                            type: array
                            description: 'Shipments.'
                            openapiContext:
                                example: []
                        items:
                            type: array
                            description: 'Cart items.'
                            openapiContext:
                                example:
                                    - sku: '001_25904006'
                                      quantity: 2
                                      unitPrice: 3500
                        totals:
                            type: object
                            description: 'Calculated totals for the cart snapshot.'
                            properties:
                                expenseTotal:
                                    type: integer
                                    description: 'Total expenses in cents.'
                                    openapiContext:
                                        example: 590
                                discountTotal:
                                    type: integer
                                    description: 'Total discount in cents.'
                                    openapiContext:
                                        example: 0
                                taxTotal:
                                    type: object
                                    description: 'Tax total breakdown.'
                                    properties:
                                        tax_rate:
                                            type: number
                                            description: 'Effective tax rate.'
                                            openapiContext:
                                                example: 19
                                        amount:
                                            type: integer
                                            description: 'Tax amount in cents.'
                                            openapiContext:
                                                example: 1330
                                subtotal:
                                    type: integer
                                    description: 'Subtotal in cents.'
                                    openapiContext:
                                        example: 7000
                                grandTotal:
                                    type: integer
                                    description: 'Grand total in cents.'
                                    openapiContext:
                                        example: 8330
                                priceToPay:
                                    type: integer
                                    description: 'Price to pay in cents.'
                                    openapiContext:
                                        example: 8330
                metadata:
                    type: object
                    description: 'Version metadata.'
                    properties:
                        delivery_date:
                            type: string
                            description: 'Requested delivery date.'
                            openapiContext:
                                example: '2025-03-01'
                        note:
                            type: string
                            description: 'Note for the quote request.'
                            openapiContext:
                                example: 'Please deliver before noon'
                totals:
                    type: object
                    description: 'Calculated totals for this version.'
                    properties:
                        subtotal:
                            type: integer
                            description: 'Subtotal in cents.'
                            openapiContext:
                                example: 7000
                        grandTotal:
                            type: integer
                            description: 'Grand total in cents.'
                            openapiContext:
                                example: 8330

        customer:
            type: object
            objectName: Customer
            writable: false
            readable: true
            description: 'Customer and company user information'
            properties:
                firstName:
                    type: string
                    description: 'Customer first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Customer last name.'
                    openapiContext:
                        example: 'Doe'
                email:
                    type: string
                    description: 'Customer email address.'
                    openapiContext:
                        example: 'john.doe@example.com'
                companyUserReference:
                    type: string
                    description: 'Company user reference.'
                    openapiContext:
                        example: 'DE--1'

        companyUserUuid:
            type: string
            writable: true
            readable: false
            required: false
            description: 'Company user UUID to create quote request on behalf of'
            openapiContext:
                example: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'

        metadata:
            type: object
            objectName: QuoteRequestMetadata
            writable: true
            readable: false
            required: false
            description: 'Metadata including delivery date and note'
            properties:
                delivery_date:
                    type: string
                    description: 'Requested delivery date.'
                    openapiContext:
                        example: '2025-03-01'
                note:
                    type: string
                    description: 'Note for the quote request.'
                    openapiContext:
                        example: 'Urgent delivery requested'

        unitPriceMap:
            type: array
            writable: true
            readable: false
            required: false
            description: 'Map of groupKey to unit price for custom pricing'
            openapiContext:
                example:
                    '001_25904006_offer1': 3500
