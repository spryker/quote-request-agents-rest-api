resource:
    name: AgentQuoteRequestSendToCustomer
    shortName: agent-quote-request-send-to-customer
    description: 'Send a quote request to customer as an agent'

    processor: Spryker\Glue\QuoteRequestAgentsRestApi\Api\Storefront\Processor\AgentQuoteRequestSendToCustomerStorefrontProcessor

    paginationEnabled: false

    security: "is_granted('ROLE_AGENT')"

    operations:
        - type: Post
          description: 'Send a quote request to customer'
          uriTemplate: '/agent-quote-requests/{quoteRequestReference}/agent-quote-request-send-to-customer'
          uriVariables:
              quoteRequestReference:
                  toProperty: 'quoteRequest'
                  fromClass: AgentQuoteRequestsStorefrontResource
          openapiContext:
              responses:
                  200:
                      description: 'Quote request sent to the customer.'
                  401:
                      description: 'Missing or invalid agent access token.'
                  404:
                      description: 'Quote request not found (code 4501).'
                  422:
                      description: 'Quote request status does not allow sending to customer (code 4504).'

    properties:
        quoteRequestReference:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Reference of the sent quote request'
            openapiContext:
                example: 'DE--21-123'

        status:
            type: string
            writable: false
            readable: true
            description: 'Status after sending to customer'
            openapiContext:
                example: 'ready'

        quoteRequest:
            type: AgentQuoteRequestsStorefrontResource
            writable: false
            readable: false
            required: false
            description: 'The parent quote request'
